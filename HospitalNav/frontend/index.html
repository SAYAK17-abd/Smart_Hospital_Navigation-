<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNav - Hospital Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MAIN SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-header">
        <h2>🚑 SmartNav+</h2>
        <div class="header-buttons">
            <button class="icon-btn" onclick="toggleSettingsPanel()" title="Settings">⚙️</button>
            <button class="icon-btn" onclick="toggleFavoritesPanel()" title="Favorites">⭐</button>
            <button class="icon-btn" onclick="toggleHistoryPanel()" title="History">📜</button>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="hospitalSearch" placeholder="🔍 Search hospital..." onkeyup="searchHospitalByName(this.value)">
    </div>

    <div class="filter-section">
        <label for="speciality" style="display: none;">Speciality</label>
        <select id="speciality">
            <option value="all">🏥 Any Speciality</option>
            <option value="eye">👁️ Eye Care</option>
            <option value="heart">❤️ Cardiology</option>
            <option value="cancer">🔬 Oncology</option>
        </select>

        <label for="type" style="display: none;">Hospital Type</label>
        <select id="type">
            <option value="all">📋 All Types</option>
            <option value="govt">🏛️ Government</option>
            <option value="private">💼 Private</option>
        </select>
    </div>

    <div class="button-group">
        <button onclick="useGPS()" class="btn-primary">📍 Use GPS</button>
        <button onclick="loadFilteredHospitals()" class="btn-primary">🔍 Search</button>
        <button onclick="emergencyRoute()" class="danger">🚨 Emergency</button>
    </div>

    <div id="info"></div>

    <!-- Comparison Section -->
    <div id="comparisonBox" style="display:none; margin-top: 12px; padding: 10px; background: rgba(50, 80, 130, 0.3); border-radius: 8px; font-size: 12px;">
        <b>📊 Comparing:</b>
        <div id="comparisonList"></div>
        <button onclick="compareHospitals()" style="margin-top: 8px; padding: 6px 8px; font-size: 11px;">Compare</button>
        <button onclick="clearComparison()" style="margin-top: 8px; padding: 6px 8px; font-size: 11px;">Clear</button>
    </div>
</div>

<!-- FAVORITES PANEL -->
<div id="favoritesPanel" class="side-panel" style="display: none;">
    <div class="panel-header">
        <h3>⭐ Favorites</h3>
        <button onclick="toggleFavoritesPanel()" class="close-btn">✕</button>
    </div>
    <div id="favoritesList" class="panel-content">
        <p style="color: #9db4d4;">No favorites yet. Click ⭐ to add.</p>
    </div>
</div>

<!-- HISTORY PANEL -->
<div id="historyPanel" class="side-panel" style="display: none;">
    <div class="panel-header">
        <h3>📜 History</h3>
        <button onclick="toggleHistoryPanel()" class="close-btn">✕</button>
    </div>
    <div id="historyList" class="panel-content">
        <p style="color: #9db4d4;">No history yet.</p>
    </div>
</div>

<!-- SETTINGS PANEL -->
<div id="settingsPanel" class="side-panel" style="display: none;">
    <div class="panel-header">
        <h3>⚙️ Settings</h3>
        <button onclick="toggleSettingsPanel()" class="close-btn">✕</button>
    </div>
    <div class="panel-content">
        <div class="setting-item">
            <label>
                <input type="checkbox" id="soundToggle" checked onchange="saveSetting('sound', this.checked)">
                🔊 Sound Alerts
            </label>
        </div>
        <div class="setting-item">
            <label>
                <input type="checkbox" id="trafficToggle" checked onchange="saveSetting('traffic', this.checked)">
                🚦 Show Traffic
            </label>
        </div>
        <div class="setting-item">
            <label>
                <input type="checkbox" id="satelliteToggle" onchange="toggleSatelliteView(this.checked)">
                🛰️ Satellite View
            </label>
        </div>
        <div class="setting-item">
            <label>
                <input type="checkbox" id="voiceToggle" checked onchange="saveSetting('voice', this.checked)">
                🎤 Voice Commands
            </label>
        </div>
        <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);">
            <button onclick="clearAllData()" style="background: var(--danger); font-size: 12px; padding: 8px;">🗑️ Clear All Data</button>
        </div>
    </div>
</div>

<!-- HOSPITAL DETAILS MODAL -->
<div id="hospitalModal" class="modal" style="display: none;">
    <div class="modal-content">
        <button class="close-btn" onclick="closeHospitalModal()">✕</button>
        <div id="hospitalModalBody"></div>
    </div>
</div>

<!-- COMPARISON MODAL -->
<div id="comparisonModal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <button class="close-btn" onclick="closeComparisonModal()">✕</button>
        <h2 style="margin-bottom: 16px;">📊 Hospital Comparison</h2>
        <div id="comparisonTable"></div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
